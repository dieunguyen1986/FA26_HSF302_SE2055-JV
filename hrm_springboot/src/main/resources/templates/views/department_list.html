<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Department Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

</head>
<body>
<div class="container-fluid">
    <h2>Department List</h2>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Department Name</th>
            <th scope="col">Manager Name</th>
            <th scope="col">Description</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dept: ${departments}">
            <th scope="row">1</th>
            <td th:text="${dept.departmentName}"></td>
            <td th:text="${dept.managerName}"></td>
            <td th:text="${dept.description}"></td>

            <td>
                <a type="button" th:href="@{/departments/edit/{id}(id=${dept.id})}" class="btn btn-primary" data-toggle="modal">Edit</a>
                <a type="button" class="btn btn-danger" data-toggle="modal">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
